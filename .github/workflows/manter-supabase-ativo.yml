# =============================================================================
# Manter o Supabase ativo
# -----------------------------------------------------------------------------
# O plano gratuito do Supabase PAUSA o projeto após 7 dias sem uso.
# Este workflow chama a função public.ping() a cada 3 dias para evitar isso.
#
# A função ping() não lê nem devolve nenhum dado: só responde "ok <data>".
#
# Precisa de 2 secrets no repositório (Settings → Secrets and variables →
# Actions): SUPABASE_URL e SUPABASE_ANON_KEY. Passo a passo em
# docs/fase1-supabase.md. Sem os secrets, o workflow só avisa e não falha.
#
# Atenção: o GitHub desativa workflows agendados de repositórios públicos
# após 60 dias sem nenhum commit. Se isso acontecer, ele manda e-mail; basta
# reativar em Actions → "Manter Supabase ativo" → "Enable workflow".
# =============================================================================
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar ping() no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secrets SUPABASE_URL / SUPABASE_ANON_KEY ainda não configurados."
            exit 0
          fi

          # Normaliza a URL: tira espaços, barra final e um "/rest/v1" colado por engano.
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          URL=${URL%/}; URL=${URL%/rest/v1}; URL=${URL%/}

          # Confere o formato sem revelar o valor (o GitHub mascara os secrets no log).
          if ! printf '%s' "$URL" | grep -Eq '^https://[a-z0-9]{20}\.supabase\.co$'; then
            echo "::error::SUPABASE_URL fora do formato esperado https://<20 letras/números>.supabase.co"
            echo "Copie a 'Project URL' em Supabase → Project Settings → Data API (ou API Keys)."
            exit 1
          fi

          CODIGO=$(curl -sS -o resposta.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $CODIGO"
          echo "Supabase respondeu: $(cat resposta.txt)"

          case "$CODIGO" in
            200) echo "✅ Supabase ativo." ;;
            401|403) echo "::error::Chave recusada. Confira SUPABASE_ANON_KEY (publishable/anon, NÃO a secret)."; exit 1 ;;
            404) echo "::error::Função ping() não encontrada. Confira se o sql/001_schema.sql rodou neste projeto e se o schema 'public' está exposto em Project Settings → Data API."; exit 1 ;;
            *)   echo "::error::Resposta inesperada do Supabase."; exit 1 ;;
          esac
